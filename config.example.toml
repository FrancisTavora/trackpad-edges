# trackpad-edges settings. Copy to /etc/trackpad-edges/config.toml
# (install.sh does this for you), edit, then:
#   sudo systemctl restart trackpad-edges
# Anything left out uses the default shown here.

# Regex for your touchpad's name (see `sudo libinput list-devices`).
# Empty = the first device with "touchpad" in its name.
touchpad_name = ""

# What each edge does: "volume", "brightness" or "none".
left_edge = "volume"
right_edge = "brightness"

# Touch zones, as fractions of the touchpad size.
edge_width = 0.07       # width of the left/right strips
top_dead_zone = 0.20    # touches starting in the top 20% are ignored
                        # (keeps ASUS NumberPad corner swipes working; 0 = off)
activation = 0.03       # vertical travel before the first step
sensitivity = 0.018     # vertical travel per step (smaller = faster)

# Volume: "auto" uses KDE's own shortcut (with OSD) on Plasma,
# otherwise wpctl (PipeWire), otherwise pactl (PulseAudio).
volume_backend = "auto"
volume_step = 5         # percent per step (wpctl / pactl only)

# Brightness
brightness_step = 0.05      # each step = 5% of the range
min_nits_fraction = 0.02    # dimmest allowed = 2% of the range
remember_brightness = true  # restore the last level after reboot/login/resume

# Peak brightness in nits, so the laptop and external monitors look equally
# bright. "internal" is the laptop panel (use its SDR rating, not HDR).
# Other keys match part of the monitor name from `sudo ddcutil detect --brief`.
[screen_nits]
internal = 400
# "Optix G241VC" = 250
# "ARZOPA" = 300
